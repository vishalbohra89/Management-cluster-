
# Cluster-wide read-only permissions for Jenkins validation
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-validation-reader
rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - persistentvolumeclaims
      - events
      - configmaps
      - nodes
      - namespaces
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  # Deployments and workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Jobs and scheduled jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # Ingress resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
    verbs: ["get", "list", "watch"]

  # Kubernetes Gateway API resources
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - httproutes
      - gateways
      - gatewayclasses
      - grpcroutes
      - referencegrants
      - tcproutes
      - tlsroutes
      - udproutes
    verbs: ["get", "list", "watch"]
---
# Bind the role to Jenkins's ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-validation-reader-binding
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-validation-reader
