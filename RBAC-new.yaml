# ============================================================
# ACTIVE: broad grant — unblocks Helm/kubectl across the whole
# cluster for the Jenkins ServiceAccount. Simplest option, but
# equivalent to giving Jenkins root on the cluster.
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-integration
  labels:
    k8s-app: jenkins-image-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: jenkins

